apiVersion: apps/v1
kind: Deployment
metadata:
  name: hundred
  namespace: hundred
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hundred
  template:
    metadata:
      labels:
        app: hundred
    spec:
      imagePullSecrets:
        - name: ghcr
      # Migrations run to completion before the server starts, so a pod never
      # serves against a schema it has not migrated. It needs the same
      # environment as the server, hence the anchor.
      initContainers:
        - name: migrate
          image: ghcr.io/jooakar/hundred:main
          imagePullPolicy: Always
          command: ["node", "migrate.mjs"]
          env: &env
            # PGPASSWORD is the same value the postgres role was created with.
            # Kubernetes expands $(PGPASSWORD) below, so no connection URL with a
            # password in it has to be stored anywhere.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: env
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://hundred:$(PGPASSWORD)@postgres.default.svc.cluster.local:5432/hundred
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: env
                  key: BETTER_AUTH_SECRET
            # Unset, these two log mail to the pod's output instead of sending it.
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: env
                  key: SENDGRID_API_KEY
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: env
                  key: MAIL_FROM
            - name: MAIL_FROM_NAME
              value: Hundred
            # adapter-node resolves request URLs against this, and better-auth
            # builds its callback and invitation links from it.
            - name: ORIGIN
              value: https://beta.hundred.app
      containers:
        - name: hundred
          # The tag is mutable and CI restarts this deployment after pushing to
          # it, so releases never commit here. Every build is also pushed as
          # :<sha>, which is what to pin if a rollout has to be held back.
          image: ghcr.io/jooakar/hundred:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env: *env
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
