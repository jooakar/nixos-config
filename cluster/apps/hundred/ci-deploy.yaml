# The identity GitHub Actions deploys as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy
  namespace: hundred
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deploy
  namespace: hundred
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-deploy
subjects:
  - kind: ServiceAccount
    name: ci-deploy
    namespace: hundred
---
# A non-expiring token for the account above.
# See the README for turning it into the kubeconfig the workflow uses.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deploy-token
  namespace: hundred
  annotations:
    kubernetes.io/service-account.name: ci-deploy
type: kubernetes.io/service-account-token
