apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 90.0.0
    helm:
      valuesObject:
        # k3s runs the control plane as a single process, so these have no
        # separate endpoints to scrape and would only ever report as down.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        # Nothing is on call. Alerting rules still evaluate and show up in
        # Grafana; there is just nowhere to route them.
        alertmanager:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 15d
            # Adopt every ServiceMonitor, PodMonitor and PrometheusRule in the
            # cluster, not just the ones this chart labels as its own.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1536Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        grafana:
          # Both keys come from secrets/cluster/monitoring/, published as the
          # namespace's `env` secret by modules/nixos/cluster-secrets.nix.
          admin:
            existingSecret: env
            userKey: GRAFANA_ADMIN_USER
            passwordKey: GRAFANA_ADMIN_PASSWORD
          startupProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            timeoutSeconds: 5
            failureThreshold: 6
          persistence:
            enabled: true
            storageClassName: local-path
            size: 2Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          grafana.ini:
            server:
              root_url: https://grafana.joona.codes
          # Prometheus is wired up by the chart's own sidecar; Loki is not.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki-gateway.monitoring.svc.cluster.local
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              # Tailnet only, like argocd. The cert is issued over DNS-01, so
              # nothing has to reach this from the internet.
              nginx.ingress.kubernetes.io/whitelist-source-range: 100.64.0.0/10
            hosts:
              - grafana.joona.codes
            tls:
              - hosts:
                  - grafana.joona.codes
                secretName: grafana-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The operator CRDs are far past the annotation size a client-side apply
      # can record.
      - ServerSideApply=true
